name: docker-cleanup

on: delete

# The job reads the repository for docker-branch-tag.sh and uses Docker Hub
# credentials to remove the tag.
permissions:
  contents: read

jobs:
  cleanup_branch:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      # ci.yml makes the branch tag with the same script. The script fails for
      # a reserved tag or a tag that another branch uses, so the job never
      # removes an image that belongs to something else. The password and the
      # token stay out of the process arguments: jq reads the password from
      # the environment, and curl reads the header from stdin. A tag that
      # never existed, such as one of a branch without a PR, is no error.
      - name: remove docker tag
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail

          tag="$(.github/scripts/docker-branch-tag.sh "$BRANCH")"
          image="l3uddz/autoscan:$tag"

          token="$(jq -n '{username: env.DOCKER_USERNAME, password: env.DOCKER_PASSWORD}' |
            curl -sS --fail-with-body -H 'Content-Type: application/json' --data @- \
              https://hub.docker.com/v2/users/login/ |
            jq -r '.token // empty')"
          if [ -z "$token" ]; then
            echo "::error::Docker Hub login returned no token"
            exit 1
          fi
          echo "::add-mask::$token"

          status="$(printf 'Authorization: JWT %s\n' "$token" |
            curl -sS --globoff -o /dev/null -w '%{http_code}' -X DELETE -H @- \
              "https://hub.docker.com/v2/repositories/l3uddz/autoscan/tags/$tag/")"
          case "$status" in
            204) echo "removed: $image" ;;
            404) echo "no such tag: $image" ;;
            *)
              echo "::error::removing $image failed with status $status"
              exit 1
              ;;
          esac
