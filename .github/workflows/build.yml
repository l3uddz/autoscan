name: Build

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
    branches:
      - master

# Only the release job writes repository contents. Every other job reads.
permissions:
  contents: read

jobs:
  # govulncheck is separate from the required build job, so that a new
  # advisory does not block unrelated pull requests.
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      # tools: go and goreleaser, at the versions in mise.toml
      - name: mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # build checks and packages branches and pull requests. It is the required
  # check. The release job handles v* tags.
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      # dependencies
      - name: qemu
        if: github.event.pull_request.head.repo.fork == false
        uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7 # v2.2.0

      - name: buildx
        if: github.event.pull_request.head.repo.fork == false
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0

      # checkout
      - name: checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 0

      # tools: go and goreleaser, at the versions in mise.toml
      - name: mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: tool info
        run: |
          go version
          go env
          goreleaser --version

      # cache
      - name: cache-go
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-cache-mod

      # vendor
      - name: vendor
        run: mise run vendor

      # test
      - name: tests
        run: mise run test

      - name: lint
        run: mise run lint

      # git status
      - name: git status
        run: git status

      # build reqs
      - name: branch name
        id: branch-names
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5 # v9.0.2
        with:
          replace_slashes_with_hyphens: "true"

      # build
      - name: build
        run: mise run snapshot

      # artifacts
      - name: artifact_linux
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build_linux
          path: dist/*linux*

      - name: artifact_darwin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build_darwin
          path: dist/*darwin*

      # docker login
      - name: docker login
        if: github.event.pull_request.head.repo.fork == false
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin

      # docker build (branch)
      - name: docker - build branch
        if: github.event.pull_request.head.repo.fork == false
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3.3.1
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          pull: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            l3uddz/autoscan:${{ steps.branch-names.outputs.current_branch }}

      # cleanup
      - name: cleanup
        if: github.event.pull_request.head.repo.fork == false
        run: |
          rm -f ${HOME}/.docker/config.json

  # release publishes the GitHub release and the release Docker tags for a v*
  # tag. It is the only job that writes repository contents.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # dependencies
      - name: qemu
        uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7 # v2.2.0

      - name: buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0

      # checkout
      - name: checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 0

      # tools: go and goreleaser, at the versions in mise.toml
      - name: mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      # vendor, test, and lint before the release
      - name: vendor
        run: mise run vendor

      - name: tests
        run: mise run test

      - name: lint
        run: mise run lint

      - name: tag name
        id: branch-names
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5 # v9.0.2
        with:
          strip_tag_prefix: "v"

      # publish
      - name: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
        run: mise run publish

      # artifacts
      - name: artifact_linux
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build_linux
          path: dist/*linux*

      - name: artifact_darwin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build_darwin
          path: dist/*darwin*

      # docker login
      - name: docker login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin

      # docker build (latest & tag)
      - name: docker - build release
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3.3.1
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          pull: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            l3uddz/autoscan:${{ steps.branch-names.outputs.tag }}
            l3uddz/autoscan:latest

      # cleanup
      - name: cleanup
        if: always()
        run: |
          rm -f ${HOME}/.docker/config.json
