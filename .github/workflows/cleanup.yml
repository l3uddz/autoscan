name: Docker Cleanup

on: delete

# The job reads the repository for docker-branch-tag.sh and uses Docker Hub
# credentials to remove the tag.
permissions:
  contents: read

jobs:
  cleanup_branch:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          sparse-checkout: .github/scripts

      - name: remove docker tag
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail

          # build.yml makes the branch tag with the same script. The script
          # fails for a reserved tag or a tag that another branch uses, so
          # the job never removes an image that belongs to something else.
          tag="$(.github/scripts/docker-branch-tag.sh "$BRANCH")"

          token="$(jq -n --arg username "$DOCKER_USERNAME" --arg password "$DOCKER_PASSWORD" \
              '{username: $username, password: $password}' \
            | curl -sS --fail-with-body -H 'Content-Type: application/json' --data @- \
              https://hub.docker.com/v2/users/login/ \
            | jq -r '.token // empty')"
          if [ -z "$token" ]; then
            echo "Docker Hub login returned no token" >&2
            exit 1
          fi
          echo "::add-mask::$token"

          status="$(curl -sS --globoff -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: JWT $token" \
            "https://hub.docker.com/v2/repositories/l3uddz/autoscan/tags/${tag}/")"
          case "$status" in
            204) echo "Removed l3uddz/autoscan:${tag}" ;;
            404) echo "No image tag l3uddz/autoscan:${tag}" ;;
            *) echo "Removing l3uddz/autoscan:${tag} failed with HTTP $status" >&2; exit 1 ;;
          esac
