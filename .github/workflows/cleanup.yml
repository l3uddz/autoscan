name: Docker Cleanup

on: delete

jobs:
  cleanup_branch:
    if: startsWith(github.event.ref_type, 'branch') == true
    runs-on: ubuntu-latest
    steps:
      - name: docker tag
        uses: frabert/replace-string-action@v2
        id: dockertag
        with:
          pattern: '[:\.\/]+'
          string: "${{ github.event.ref }}"
          replace-with: "-"
          flags: "g"

      - name: remove docker tag
        shell: bash
        env:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          tag: ${{ steps.branch-names.outputs.current_branch }}
        run: |
          docker run --rm lumir/remove-dockerhub-tag --user "$username" --password "$password" l3uddz/autoscan:$tag
