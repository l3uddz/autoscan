name: Docker Cleanup

on: delete

jobs:
  cleanup_branch:
    if: startsWith(github.event.ref_type, 'branch') == true
    runs-on: ubuntu-latest
    steps:
      - name: branch name
        id: branch-names
        uses: tj-actions/branch-names@v9
        with:
          replace_slashes_with_hyphens: "true"
          strip_tag_prefix: "v"

      - name: remove docker tag
        shell: bash
        env:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          tag: ${{ steps.branch-names.outputs.current_branch }}
        run: |
          docker run --rm lumir/remove-dockerhub-tag --user "$username" --password "$password" l3uddz/autoscan:$tag
