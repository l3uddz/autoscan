name: ci

# Pushes build master and v* tags. Every other branch builds through its PR
# into master, so only one run publishes each branch tag.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

# Only the release job writes repository contents. Every other job reads.
permissions:
  contents: read

# A new run cancels the older run for the same ref, so an older commit never
# replaces the image of a newer commit.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: l3uddz/autoscan

jobs:
  # govulncheck is separate from the required build job, so that a new
  # advisory does not block unrelated pull requests.
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tools: go and goreleaser, at the versions in mise.toml
      - name: mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # build checks and packages branches and pull requests. It is the required
  # check. The release job handles v* tags.
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      # dependencies
      - name: buildx
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # checkout
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # tools: go and goreleaser, at the versions in mise.toml
      - name: mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: tool info
        run: |
          go version
          go env
          goreleaser --version

      # cache
      - name: cache-go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # vendor
      - name: vendor
        run: mise run vendor

      # go mod tidy must not change the committed module files.
      - name: tidy check
        run: git diff --exit-code -- go.mod go.sum

      # test
      - name: tests
        run: mise run test

      - name: lint
        run: mise run lint

      # git status
      - name: git status
        run: git status

      # The branch tag comes from docker-branch-tag.sh, which docker-cleanup.yml
      # also uses. A fork PR publishes no image, so it needs no tag.
      - name: image tag
        id: image
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          tag="$(.github/scripts/docker-branch-tag.sh "$BRANCH")"
          echo "tag=$IMAGE:$tag" >> "$GITHUB_OUTPUT"

      # build
      - name: build
        run: mise run snapshot

      # artifacts
      - name: artifact_linux
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build_linux
          path: dist/*linux*

      - name: artifact_darwin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build_darwin
          path: dist/*darwin*

      # docker login
      - name: docker login
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin

      # docker build (branch)
      - name: docker - build branch
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          pull: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.image.outputs.tag }}

      # cleanup
      - name: cleanup
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        run: rm -f "$HOME/.docker/config.json"

  # release publishes the GitHub release and the release Docker tags for a v*
  # tag. It is the only job that writes repository contents.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # dependencies
      - name: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # checkout
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # tools: go and goreleaser, at the versions in mise.toml
      - name: mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      # vendor, test, and lint before the release
      - name: vendor
        run: mise run vendor

      - name: tests
        run: mise run test

      - name: lint
        run: mise run lint

      # This step runs before publish, so a version that is not a valid
      # Docker tag stops the run before goreleaser makes a GitHub release.
      - name: version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::version '$version' is not a valid Docker tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # publish
      - name: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
        run: mise run publish

      # artifacts
      - name: artifact_linux
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build_linux
          path: dist/*linux*

      - name: artifact_darwin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build_darwin
          path: dist/*darwin*

      # docker login
      - name: docker login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin

      # docker build (latest & tag)
      - name: docker - build release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          pull: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest

      # cleanup
      - name: cleanup
        if: always()
        run: rm -f "$HOME/.docker/config.json"
