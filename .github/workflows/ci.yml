name: ci

# Pushes build master and v* tags. Every other branch builds through its PR
# into master, so only one run publishes each branch tag.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

# Runs only read the repository. The release job of a v* tag gets write
# access, because goreleaser publishes a GitHub release.
permissions:
  contents: read

# A new run cancels the older run for the same ref, so an older commit never
# replaces the image of a newer commit.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: l3uddz/autoscan

jobs:
  # govulncheck is separate from the required build job, so that a new
  # advisory does not block unrelated pull requests.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tools: go, goreleaser, and golangci-lint, at the versions in mise.toml
      - name: mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # The master protection ruleset requires a check named build, so this job
  # keeps its name. A v* tag runs the release job instead, with the same steps.
  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps: &steps
      # checkout
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # tools: go, goreleaser, and golangci-lint, at the versions in mise.toml
      - name: mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: tool info
        run: |
          go version
          goreleaser --version
          golangci-lint version

      # cache
      - name: cache-go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # vendor
      - name: vendor
        run: mise run vendor

      # go mod tidy must not change the committed module files.
      - name: tidy check
        run: git diff --exit-code -- go.mod go.sum

      # test
      - name: tests
        run: mise run test

      # lint: formatting, go vet, staticcheck, and the complexity limit
      - name: lint
        run: mise run lint

      # Docker tags: the version and latest for a v* tag. Otherwise the
      # branch tag from docker-branch-tag.sh, which docker-cleanup.yml also
      # uses. This step runs before publish, so a version that is not a valid
      # Docker tag stops the run before goreleaser makes a GitHub release.
      - name: image tags
        id: image
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
            if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::version '$version' is not a valid Docker tag"
              exit 1
            fi
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            printf 'tags<<EOF\n%s:%s\n%s:latest\nEOF\n' "$IMAGE" "$version" "$IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            # A fork PR publishes no image, so it needs no branch tag.
            if [ "$FORK" != "true" ]; then
              tag="$(.github/scripts/docker-branch-tag.sh "${HEAD_REF:-$REF_NAME}")"
              echo "tags=$IMAGE:$tag" >> "$GITHUB_OUTPUT"
            fi
          fi

      # build
      - name: build
        if: steps.image.outputs.is_tag == 'false'
        run: mise run snapshot

      # publish
      - name: publish
        if: steps.image.outputs.is_tag == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run publish

      # artifacts
      - name: artifact_linux
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build_linux
          path: dist/*linux*

      - name: artifact_darwin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build_darwin
          path: dist/*darwin*

      # docker
      - name: buildx
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: docker login
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: docker build
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          pull: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.image.outputs.tags }}

  # release publishes the GitHub release and the release Docker tags for a v*
  # tag. It is the only job that writes repository contents.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps: *steps
