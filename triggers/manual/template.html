<!DOCTYPE html>
<html lang="en">
<head>
    <title>autoscan</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #212529;
            background: #fff;
        }
        main {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            margin: 10px 0 96px;
            text-align: center;
            font-weight: 500;
        }
        h2 {
            margin: 0 0 12px;
            font-size: 1.5rem;
            font-weight: 500;
        }
        .input-group {
            display: flex;
            margin-bottom: 16px;
        }
        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 8px 12px;
            font-size: 1rem;
            color: #495057;
            border: 1px solid #ced4da;
            border-right: 0;
            border-radius: 4px 0 0 4px;
        }
        input[type="submit"] {
            padding: 8px 16px;
            font-size: 1rem;
            color: #495057;
            background: #fff;
            border: 1px solid #6c757d;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            color: #fff;
            background: #6c757d;
        }
        .alert {
            padding: 12px 16px;
            border: 1px solid transparent;
            border-radius: 4px;
            text-align: center;
        }
        .alert-info { color: #0c5460; background: #d1ecf1; border-color: #bee5eb; }
        .alert-success { color: #155724; background: #d4edda; border-color: #c3e6cb; }
        .alert-danger { color: #721c24; background: #f8d7da; border-color: #f5c6cb; }
    </style>
</head>
<body>
<main>
    <h1>autoscan</h1>
    <h2>Path to scan</h2>
    <form id="scan">
        <div class="input-group">
            <input type="text" name="dir" value="" required="required"
                   placeholder="Path to scan e.g. /mnt/unionfs/Media/Movies/Movie Name (year)"
                   aria-label="Path to scan e.g. /mnt/unionfs/Media/Movies/Movie Name (year)"
                   aria-describedby="btn-submit">
            <input type="submit" value="Submit" id="btn-submit">
        </div>
    </form>
    <div id="result" class="alert alert-info" role="alert">Clicking <b>Submit</b> will add the path to the scan queue.</div>
</main>

<script>
    const form = document.getElementById('scan');
    const result = document.getElementById('result');

    function show(kind, message) {
        result.className = 'alert alert-' + kind;
        result.textContent = message;
    }

    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        // The query of the page URL carries the dir values. The URL starts
        // from the origin, because fetch rejects a URL with credentials.
        const url = new URL(window.location.pathname, window.location.origin);
        url.search = new URLSearchParams(new FormData(form)).toString();
        try {
            const response = await fetch(url, {method: 'POST'});
            if (response.ok) {
                show('success', 'Scan queued');
            } else {
                show('danger', 'Failed: ' + response.status + ' ' + response.statusText);
            }
        } catch (error) {
            show('danger', 'Failed: ' + error.message);
        }
    });
</script>
</body>
</html>
