<!DOCTYPE html>
<html lang="en">
<head>
    <title>autoscan</title>
    <meta charset="utf-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous"/>
</head>
<body>
<div class="container">
    <div class="row justify-content-md-center">
        <div class="col-md-auto text-center" style="padding-top: 10px;">
            <h1 style="margin: 10px; margin-bottom: 150px;">autoscan</h1>
            <h3 class="text-left" style="margin: 10px;">Path to scan</h3>
            <form id="scan">
                <div class="input-group mb-3" style="width: 600px;">
                    <input class="form-control" type="text" name="dir" value="" required="required"
                           placeholder="Path to scan e.g. /mnt/unionfs/Media/Movies/Movie Name (year)"
                           aria-label="Path to scan e.g. /mnt/unionfs/Media/Movies/Movie Name (year)"
                           aria-describedby="btn-submit">
                    <div class="input-group-append"><input class="btn btn-outline-secondary primary" type="submit"
                                                           value="Submit" id="btn-submit"></div>
                </div>
            </form>
            <div id="result" class="alert alert-info" role="alert">Clicking <b>Submit</b> will add the path to the scan queue.</div>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('scan');
    const result = document.getElementById('result');

    function show(kind, message) {
        result.className = 'alert alert-' + kind;
        result.textContent = message;
    }

    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        // The query of the page URL carries the dir values. The URL starts
        // from the origin, because fetch rejects a URL with credentials.
        const url = new URL(window.location.pathname, window.location.origin);
        url.search = new URLSearchParams(new FormData(form)).toString();
        try {
            const response = await fetch(url, {method: 'POST'});
            if (response.ok) {
                show('success', 'Scan queued');
            } else {
                show('danger', 'Failed: ' + response.status + ' ' + response.statusText);
            }
        } catch (error) {
            show('danger', 'Failed: ' + error.message);
        }
    });
</script>
</body>
</html>
