[tools]
go = "1.26"
goreleaser = "2.20.2"

[tasks.vendor]
description = "Tidy the Go modules and create vendor/"
run = ["go mod tidy", "go mod vendor"]

[tasks.vendor-update]
description = "Update the Go dependencies and create vendor/"
run = ["go get -u ./...", { task = "vendor" }]

[tasks.test]
description = "Run the Go tests with the race detector"
# GO_PACKAGES adds arguments to go test, for example GO_PACKAGES="-run TestX".
run = "go test ./... -cover -v -race ${GO_PACKAGES:-}"

[tasks.lint]
description = "Check gofmt formatting, then run go vet and staticcheck"
# gofmt -l exits 0 even when it lists files, so fail on any output.
# Only tracked files are checked, because vendor/ is not gofmt clean.
run = [
  '''
  unformatted="$(gofmt -l $(git ls-files '*.go'))"
  if [ -n "$unformatted" ]; then
    echo "gofmt needed for:"
    echo "$unformatted"
    exit 1
  fi
  ''',
  "go vet ./...",
  "go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...",
]

[tasks.build]
description = "Build a development binary in dist/"
depends = ["vendor"]
env = { CGO_ENABLED = "0" }
run = '''
go build -mod vendor -trimpath \
  -ldflags "-s -w -X main.Version=0.0.0-dev -X main.GitCommit=$(git rev-parse --short HEAD) -X main.Timestamp=$(date +%s)" \
  -o "dist/autoscan_$(go env GOOS)_$(go env GOARCH)/autoscan" \
  ./cmd/autoscan
'''

[tasks.snapshot]
description = "Build a snapshot release in dist/ without publishing"
run = "goreleaser release --snapshot --clean"

[tasks.release]
description = "Build a release in dist/ without publishing"
run = "goreleaser release --skip=validate,publish --clean"

[tasks.publish]
description = "Build a release and publish it to GitHub"
run = "goreleaser release --clean"
